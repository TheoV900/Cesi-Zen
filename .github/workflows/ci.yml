name: CI

# Déclenche le workflow quand tu pousses sur dev
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupère le code
    - uses: actions/checkout@v3

    # 2. Installe Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # 3. Vérifie le backend
    - name: Install backend dependencies
      run: |
        cd backend
        npm install

    # 4. Vérifie le frontend
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
        npm run build
